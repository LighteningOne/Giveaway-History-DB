<!-- Main Content -->
    <main class="container">
        <header class="page-header">
            <h1>Giveaway History Database</h1>
            <p>Search historical freebies and bundles across all major storefronts.</p>
            
            <!-- Search Bar -->
            <input type="text" id="searchInput" class="search-bar" placeholder="Search for a game...">
        </header>

        <!-- Historical Data Table -->
        <div class="table-container">
            <table class="giveaway-table">
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Game Name</th>
                        <th>Storefront</th>
                        <th>Steam Page</th>
                        <th>Steam Review</th>
                    </tr>
                </thead>
                <tbody id="table-body">
                    <!-- Mockup Row (This is what the script will generate automatically) -->
                    <tr>
                        <td>2026-10-14</td>
                        <td><strong>Example Free Game</strong></td>
                        <td><span class="badge epic-badge">Epic Games</span></td>
                        <td><a href="https://store.steampowered.com/app/12345" target="_blank" class="steam-link">View Store</a></td>
                        <td><span class="review-score positive">Very Positive (8,432)</span></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>
